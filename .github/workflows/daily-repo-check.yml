name: Daily Repository Checks

on:
  schedule:
    # 每天 07:00 越南时间（00:00 UTC）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-repository-checks
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Check Python, workflow YAML, and Pine files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required repository files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "requirements.txt",
              "main.py",
              "run_ui.py",
              "run_sector.py",
              "run_etf.py",
              ".github/workflows/ci.yml",
              ".github/workflows/screener.yml",
              "indicators/Adaptive_RSI_Volume_Profile_MACD_Leader_V2.pine",
          ]

          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit("Missing required files:\n- " + "\n- ".join(missing))

          pine = Path("indicators/Adaptive_RSI_Volume_Profile_MACD_Leader_V2.pine").read_text(encoding="utf-8")
          if "//@version=6" not in pine or "indicator(" not in pine:
              raise SystemExit("Pine Script file is missing //@version=6 or indicator() declaration")

          print(f"Required-file check passed ({len(required)} files).")
          print("Pine Script header check passed (this is not a TradingView compile).")
          PY

      - name: Compile Python files
        run: |
          python -m compileall -q screener main.py run_ui.py run_sector.py run_etf.py

      - name: Validate GitHub Actions YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".github/workflows").glob("*.yml")) + sorted(Path(".github/workflows").glob("*.yaml"))
          if not files:
              raise SystemExit("No GitHub Actions workflow YAML files found")

          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"YAML OK: {path}")

          print(f"Validated {len(files)} workflow file(s).")
          PY
